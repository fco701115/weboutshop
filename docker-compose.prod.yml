version: '3.8'

services:
  app:
    build: .
    container_name: weboutshop
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
    networks:
      - weboutshop-net

networks:
  weboutshop-net:
    driver: bridge
